version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: medibridge_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: healthcare_appointment_manager
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: medibridge_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: medibridge_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/healthcare_appointment_manager
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: medibridge_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
